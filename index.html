<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade License BD &#8212; Licence Fee Estimator &amp; Renewal Guide</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="head-row">
      <div>
        <h1 id="title">Trade License BD</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <button id="langBtn" class="lang-btn" type="button">&#2476;&#2494;&#2434;&#2482;&#2494;</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="calc" type="button" id="tab-calc"></button>
      <button class="tab" data-tab="table" type="button" id="tab-table"></button>
      <button class="tab" data-tab="deadline" type="button" id="tab-deadline"></button>
      <button class="tab" data-tab="guides" type="button" id="tab-guides"></button>
      <button class="tab" data-tab="saved" type="button" id="tab-saved"></button>
      <button class="tab" data-tab="data" type="button" id="tab-data"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ============ CALCULATOR TAB ============ -->
  <section id="panel-calc" class="panel">
    <form id="calcForm" class="card" novalidate>
      <div class="field">
        <label for="catSelect" id="catLabel"></label>
        <select id="catSelect"></select>
        <p class="hint" id="catHint"></p>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="authSelect" id="authLabel"></label>
          <select id="authSelect"></select>
        </div>
        <div class="field">
          <label for="kindSelect" id="kindLabel"></label>
          <select id="kindSelect"></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="signInput" id="signLabel"></label>
          <input id="signInput" type="number" min="0" max="10000" step="1" value="0" inputmode="numeric">
          <p class="hint" id="signHint"></p>
        </div>
        <div class="field">
          <label for="lateInput" id="lateLabel"></label>
          <input id="lateInput" type="number" min="0" max="12" step="1" value="0" inputmode="numeric">
          <p class="hint" id="lateHint"></p>
        </div>
      </div>
      <p id="calcError" class="error" hidden></p>
      <button id="calcBtn" class="btn primary" type="submit"></button>
    </form>

    <div id="results" class="results" hidden>
      <div class="card total-card">
        <h2 id="billTitle"></h2>
        <div id="billLines"></div>
        <div class="total-row grand"><span id="totalLabel"></span><strong id="totalValue"></strong></div>
        <p class="meta" id="resultMeta"></p>
      </div>

      <div class="card">
        <div class="field">
          <label for="saveName" id="saveNameLabel"></label>
          <input id="saveName" type="text" maxlength="80">
        </div>
        <p id="saveError" class="error" hidden></p>
        <p id="saveOk" class="ok" hidden></p>
        <button id="saveBtn" class="btn primary" type="button"></button>
      </div>
    </div>

    <p class="disclaimer" id="disclaimer"></p>
  </section>

  <!-- ============ FEE TABLE TAB ============ -->
  <section id="panel-table" class="panel" hidden>
    <div class="card">
      <h2 id="tableTitle"></h2>
      <p class="note" id="tableNote"></p>
      <div class="field">
        <input id="tableSearch" type="search" autocomplete="off">
      </div>
      <p class="meta" id="tableCount"></p>
      <table class="tbl">
        <thead><tr><th id="thBusiness"></th><th id="thFee"></th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <p id="tableEmpty" class="empty" hidden></p>
    </div>
  </section>

  <!-- ============ DEADLINE TAB ============ -->
  <section id="panel-deadline" class="panel" hidden>
    <div class="card">
      <h2 id="deadlineTitle"></h2>
      <p class="note" id="deadlineNote"></p>
      <div class="field">
        <label for="dateInput" id="dateLabel"></label>
        <input id="dateInput" type="date">
      </div>
      <button id="checkBtn" class="btn primary" type="button"></button>
      <div id="deadlineResult" class="results" hidden>
        <p class="total-row"><span id="fyLabel"></span><strong id="fyValue"></strong></p>
        <p class="total-row"><span id="dlLabel"></span><strong id="dlValue"></strong></p>
        <p class="total-row"><span id="daysLabel"></span><strong id="daysValue"></strong></p>
        <p class="total-row"><span id="monthsLabel"></span><strong id="monthsValue"></strong></p>
        <p id="statusBadge" class="status"></p>
        <button id="applyLateBtn" class="btn" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ============ GUIDES TAB ============ -->
  <section id="panel-guides" class="panel" hidden>
    <div class="card">
      <h2 id="guidesTitle"></h2>
      <h3 id="guideNewTitle"></h3>
      <ol id="guideNewList" class="steps"></ol>
      <h3 id="guideRenTitle"></h3>
      <ol id="guideRenList" class="steps"></ol>
    </div>
    <div class="card">
      <h2 id="checklistTitle"></h2>
      <p class="meta" id="checklistProgress"></p>
      <div id="checklist" class="check-grid"></div>
    </div>
  </section>

  <!-- ============ SAVED TAB ============ -->
  <section id="panel-saved" class="panel" hidden>
    <div class="card">
      <h2 id="savedTitle"></h2>
      <p id="savedEmpty" class="empty"></p>
      <ul id="savedList" class="saved-list"></ul>
      <p class="total-row"><span id="savedTotalLabel"></span><strong id="savedTotalValue"></strong></p>
      <p id="loadedMsg" class="ok" hidden></p>
    </div>
  </section>

  <!-- ============ DATA TAB ============ -->
  <section id="panel-data" class="panel" hidden>
    <div class="card">
      <h2 id="dataTitle">Data</h2>
      <div class="btn-row">
        <button id="exportBtn" class="btn" type="button"></button>
        <a id="downloadLink" class="btn" hidden download="trade-license-bd-export.json">Download</a>
      </div>
      <div class="field">
        <label for="importText" id="importLabel">Import JSON</label>
        <textarea id="importText" rows="6"></textarea>
      </div>
      <p id="importOk" class="ok" hidden></p>
      <p id="importFail" class="error" hidden></p>
      <button id="importBtn" class="btn primary" type="button"></button>
    </div>
    <div class="card danger">
      <h2 id="eraseTitle"></h2>
      <p class="note" id="eraseHint"></p>
      <div class="field">
        <input id="eraseInput" type="text" autocomplete="off" placeholder="DELETE">
      </div>
      <p id="eraseWrong" class="error" hidden></p>
      <p id="erasedMsg" class="ok" hidden></p>
      <button id="eraseBtn" class="btn danger-btn" type="button"></button>
    </div>
  </section>
</main>

<footer class="wrap foot">
  <p id="footNote"></p>
</footer>

<script src="data.js"></script>
<script src="logic.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
